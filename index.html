<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!-- ── INSTANT REDIRECT (mobile / incognito) — runs before anything else ── -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbz0nIvj1DswJG9TKAkOGwAzfA6TIPDOMPi_CyTGzDgHy1tWrxEQCbd7iOV1FRGBc18hrA/exec";
  var page = new URLSearchParams(window.location.search).get("page");
  var finalURL = APP_URL + (page ? (APP_URL.indexOf("?")>=0?"&":"?")+"page="+encodeURIComponent(page) : "");
  var mobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var blocked = (function(){ try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return false; }catch(e){ return true; } })();
  if (mobile || blocked) { window.location.replace(finalURL); }
</script>
<!-- ── Everything below only reached by desktop non-incognito browsers ── -->
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HBTU West Alumni — Mumbai Meet 2026 Registration</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#f0ece3;}
  #loading{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;font-family:sans-serif;color:#7a5c3a;gap:14px;
  }
  .spinner{
    width:38px;height:38px;border:4px solid #d6c4a8;
    border-top-color:#7a5c3a;border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  iframe{display:none;width:100%;height:100vh;border:none;}
</style>
</head>
<body>
<!-- ============================================================
     HBTU West Alumni Meet 2026 — Registration Wrapper
     • Mobile / incognito : instant redirect (top of <head>)
     • Desktop normal     : iframe to suppress Google banner
     HOW TO UPDATE: release.sh auto-patches APP_URL above.
     ============================================================ -->
<div id="loading">
  <div class="spinner"></div>
  <span>Loading registration…</span>
</div>
<iframe id="appFrame" title="HBTU Alumni Meet 2026 Registration" allowfullscreen></iframe>
<script>
  /* Desktop iframe path */
  var frame = document.getElementById("appFrame");
  frame.src = finalURL;
  frame.addEventListener("load", function() {
    document.getElementById("loading").style.display = "none";
    frame.style.display = "block";
  });
  /* Safety fallback: redirect if iframe stalls >8s */
  setTimeout(function() {
    if (frame.style.display !== "block") window.location.replace(finalURL);
  }, 8000);
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycby3X-qmCytutULlxvMaqwRU2nGXXHcNEq4cVK4stHcnD1C53T6_djwfcxqDmTXjGI6asg/exec"/>
</noscript>
</body>
</html>
